[project]
name = "mcp-sound-engineer"
version = "0.1.0"
description = "MCP server: measures audio and returns DAW-neutral mix/master decisions"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
formats = ["soundfile>=0.12"]
exact = ["pyloudnorm>=0.1.1"]

[project.scripts]
mcp-sound-engineer = "server.engineer_server:main"

[tool.setuptools]
packages = ["server", "adapter"]
