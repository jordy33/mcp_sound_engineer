name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install numpy
      - name: tests (glob, count-checked)
        run: |
          set -o pipefail
          OUT="$(mktemp)"
          for f in tests/test_*.py; do
            echo "== $f"
            python "$f" | tee -a "$OUT"
          done
          RAN="$(grep -c '^  ok  ' "$OUT" || true)"
          DEFINED="$(grep -h '^def test_' tests/test_*.py | wc -l | tr -d ' ')"
          echo "test functions: defined=$DEFINED executed=$RAN"
          test "$RAN" -eq "$DEFINED"
      - name: installable
        run: pip install -e . && python -c "import server.rules as r; print(r.RULES_VERSION)"
